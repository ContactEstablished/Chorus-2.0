[workspace]
resolver = "3"
members = ["src-tauri", "crates/chorus-core", "crates/chorus-hook"]

[workspace.package]
version = "0.1.4"
edition = "2024"
rust-version = "1.90"
license = "MIT"
publish = false

[workspace.dependencies]
# Tauri is pinned to 2.x (D4); 3.0 is in alpha.
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-build = "2.7"
# tauri-specta and specta are release candidates; pin them exactly, as their docs require.
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
portable-pty = "0.9"
# SQLite with the library compiled in (ARCHITECTURE §7, §10).
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2"
# opencode's loopback server, OpenRouter, gateways and Jev (ARCHITECTURE §10). TLS is Windows'
# own (SChannel, through native-tls), so nothing is compiled from C.
reqwest = { version = "0.13", default-features = false, features = ["json", "native-tls"] }
# The loopback listener for agent hooks (ARCHITECTURE §10, P3). Tokio is already Tauri's runtime.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
tokio = { version = "1", features = ["net"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Networking_WinHttp",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

chorus-core = { path = "crates/chorus-core" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
